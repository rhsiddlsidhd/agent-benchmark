name: TDD Guard

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: tdd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run lint && npm run typecheck

  unit-shard:
    name: unit-${{ matrix.shard }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [server, client-components, client-state, app-admin, app-main, app-api, shared]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run test:unit:${{ matrix.shard }}

  unit:
    if: always()
    needs: unit-shard
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every unit shard
        run: test '${{ needs.unit-shard.result }}' = 'success'

  integration-client:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run test:integration:client

  integration-server:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      MONGOMS_DOWNLOAD_DIR: ~/.cache/mongodb-binaries
      POST_ONE_API_KEY: test-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: actions/cache@v4
        with:
          path: ~/.cache/mongodb-binaries
          key: mongodb-8.2.6-${{ runner.os }}
      - run: npm ci
      - run: npm run test:integration:server

  e2e-core:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

  mutation-changed:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run test:mutation

  tdd-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx vitest run --project guard
      - run: node scripts/tdd-guard/unit-shards.mjs
      - run: node scripts/tdd-guard/cli.mjs verify --ci
